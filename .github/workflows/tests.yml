
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: local_dev_password_change_me
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_user -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://taskflow_user:local_dev_password_change_me@localhost:5432/taskflow
      TEST_DATABASE_URL: postgresql+psycopg://taskflow_user:local_dev_password_change_me@localhost:5432/taskflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create isolated test database
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://taskflow_user:local_dev_password_change_me@localhost:5432/postgres",
              autocommit=True,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE DATABASE taskflow_test OWNER taskflow_user"
                  )
          finally:
              connection.close()
          PY

      - name: Apply database migrations
        run: alembic upgrade head
        env:
          RUN_POSTGRES_INTEGRATION: "1"

      - name: Run regular tests
        run: python -m pytest -v

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/test_postgres_concurrency.py -v
        env:
          RUN_POSTGRES_INTEGRATION: "1"
